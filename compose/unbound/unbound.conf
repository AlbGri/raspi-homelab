# Unbound come resolver ricorsivo dietro Pi-hole, su un Raspberry Pi 4B.
# Spiegazione in docs/dns.md. Il file va montato nel container insieme alla sua cartella,
# non da solo: vedi la voce 8 di docs/controlla.md.
server:
    verbosity: 1
    # Solo sul Pi stesso: lo interroga Pi-hole, nessun altro dispositivo
    interface: 127.0.0.1
    port: 5335
    do-ip4: yes
    do-ip6: no
    do-udp: yes
    do-tcp: yes

    # Riservatezza e risposte manipolate
    hide-identity: yes
    hide-version: yes
    harden-glue: yes
    harden-dnssec-stripped: yes
    # Spenta come nella configurazione ufficiale dell'immagine klutchell/unbound: mescolare
    # maiuscole e minuscole nelle domande causa SERVFAIL sporadici con i server che non le
    # rispettano
    use-caps-for-id: no

    # Dimensioni prudenti per un Pi 4B
    so-sndbuf: 0
    num-threads: 2
    msg-cache-slabs: 2
    rrset-cache-slabs: 2
    infra-cache-slabs: 2
    key-cache-slabs: 2
    msg-cache-size: 16m
    rrset-cache-size: 32m
    cache-min-ttl: 300
    cache-max-ttl: 86400
    prefetch: yes
    prefetch-key: yes

    # Un dominio pubblico non può rispondere con un indirizzo privato (DNS rebinding).
    # Tutti gli intervalli privati, non solo quelli usati in casa: se cambi rete o aggiungi
    # una VPN restano coperti
    private-address: 10.0.0.0/8
    private-address: 172.16.0.0/12
    private-address: 192.168.0.0/16
    private-address: 169.254.0.0/16
    private-address: fd00::/8
    private-address: fe80::/10

    # Chiavi DNSSEC della zona radice, tenute aggiornate da Unbound
    auto-trust-anchor-file: "/var/unbound/root.key"
    val-clean-additional: yes
